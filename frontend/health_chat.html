<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Chat</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body class="chat-page health-chat-page">
    <button id="back-button" onclick="goBack()">Back to Dashboard</button>
    <div class="chat-container">
        <div class="messages" id="messages"></div>
        <div class="chat-input-row">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        function goBack() {
            window.location.href = "dashboard.html";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            if (!token) {
                alert("You are not logged in. Redirecting to login page.");
                window.location.href = "index.html";
                return;
            }

            // Load the chat history from the local cache
            loadChatHistory();
        });

        function loadChatHistory() {
            const messagesDiv = document.getElementById("messages");
            const chatHistory = JSON.parse(localStorage.getItem("chatHistory")) || [];

            chatHistory.forEach(msg => {
                const messageDiv = document.createElement("div");
                messageDiv.className = `message ${msg.role}`;
                if (msg.role === "assistant") {
                    messageDiv.innerHTML = renderAssistantMarkdown(msg.text);
                } else {
                    messageDiv.textContent = msg.text;
                }
                messagesDiv.appendChild(messageDiv);
            });

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function saveMessage(role, text) {
            let chatHistory = JSON.parse(localStorage.getItem("chatHistory")) || [];
            chatHistory.push({ role, text });

            // console.log("Saving message:", { role, text });

            localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
        }

        function renderAssistantMarkdown(text) {
            return DOMPurify.sanitize(marked.parse(text));
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            const token = localStorage.getItem("token");

            if (!message) return;

            const messagesDiv = document.getElementById("messages");
            const userMessageDiv = document.createElement("div");
            userMessageDiv.className = "message user";
            userMessageDiv.textContent = message;
            messagesDiv.appendChild(userMessageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            saveMessage("user", message);

            input.value = "";

            try {
                const response = await fetch("/api/health_chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`,
                    },
                    body: JSON.stringify({ prompt: message }),
                });

                const data = await response.json();

                const assistantMessageDiv = document.createElement("div");
                assistantMessageDiv.className = "message assistant";
                const assistantResponse = data.response || "Error in response";
                assistantMessageDiv.innerHTML = renderAssistantMarkdown(assistantResponse);
                messagesDiv.appendChild(assistantMessageDiv);
                saveMessage("assistant", assistantResponse);

                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (error) {
                console.error("Error sending message:", error);
            }
        }
    </script>
</body>
</html>
